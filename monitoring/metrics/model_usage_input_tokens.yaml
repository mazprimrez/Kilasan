description: Input tokens per model call (prompt, audio and images), by feature and model.
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="journal-backend" AND jsonPayload.event="model_usage"'
valueExtractor: EXTRACT(jsonPayload.input_tokens)
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
  displayName: Model input tokens
  labels:
  - key: feature
  - key: model
labelExtractors:
  feature: EXTRACT(jsonPayload.feature)
  model: EXTRACT(jsonPayload.model)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 24
    growthFactor: 2
    scale: 1
