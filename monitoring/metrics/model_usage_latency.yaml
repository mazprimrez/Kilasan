description: How long each model call took, in milliseconds, by feature and model.
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="journal-backend" AND jsonPayload.event="model_usage"'
valueExtractor: EXTRACT(jsonPayload.latency_ms)
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "ms"
  displayName: Model latency
  labels:
  - key: feature
  - key: model
labelExtractors:
  feature: EXTRACT(jsonPayload.feature)
  model: EXTRACT(jsonPayload.model)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 24
    growthFactor: 2
    scale: 1
